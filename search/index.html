</script></nav></div></header><main id="main-content"><div class="container-narrow" style="padding-top: 3rem;"><p class="eyebrow">Search</p><h1 class="page-title">全站搜索<span class="accent">.</span></h1><p class="muted">覆盖全站页面、博客与 52 条读书笔记。结果在本地计算，不上传关键词。<span style="white-space:nowrap;"><kbd>/</kbd> 聚焦 · <kbd>↑↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 清空</span></p><input id="q" class="input" type="search" placeholder="输入关键词，例如：重阳、活着、威斯特伐利亚…" autocomplete="off" aria-label="搜索全站内容" style="margin-top: 1rem;"><p id="meta" class="meta-line" aria-live="polite"></p><ul id="results" class="search-results"></ul><p id="empty" class="muted" style="text-align:center; padding: 2rem 0; display:none;">没有找到匹配内容</p></div><script>
    (async () => {
      const input = document.getElementById('q');
      const meta = document.getElementById('meta');
      const list = document.getElementById('results');
      const empty = document.getElementById('empty');

      let index = [];
      try {
        const res = await fetch('/search-index.json');
        index = await res.json();
      } catch {
        meta.textContent = '搜索索引加载失败，请刷新重试。';
        return;
      }

      const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const highlight = (text, q) => {
        if (!q) return esc(text);
        const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        return esc(text).replace(re, (m) => `<mark>${m}</mark>`);
      };

      let hits = [];
      let focusIdx = -1;
      const render = () => {
        const q = input.value.trim();
        focusIdx = -1;
        if (!q) {
          list.innerHTML = '';
          meta.textContent = `索引 ${index.length} 条 · 输入关键词开始搜索`;
          empty.style.display = 'none';
          return;
        }
        const lower = q.toLowerCase();
        hits = index.filter((e) =>
          (e.title + ' ' + e.excerpt + ' ' + e.tag).toLowerCase().includes(lower),
        );
        meta.textContent = `${hits.length} 条结果 · 搜索「${q}」`;
        empty.style.display = hits.length ? 'none' : 'block';
        list.innerHTML = hits.slice(0, 50).map((e, i) => `
          <li class="search-result">
            <a href="${e.url}" data-idx="${i}">
              <strong>${highlight(e.title, q)}</strong>
              <div class="meta">${esc(e.tag)} · ${highlight(e.excerpt, q)}</div>
            </a>
          </li>`).join('');
      };
      const setFocus = (i) => {
        const items = [...list.querySelectorAll('a')];
        if (!items.length) return;
        focusIdx = (i + items.length) % items.length;
        items.forEach((el, j) => el.classList.toggle('active', j === focusIdx));
        items[focusIdx].scrollIntoView({ block: 'nearest' });
      };
      document.addEventListener('keydown', (e) => {
        const tag = (document.activeElement?.tagName || '').toUpperCase();
        if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
          e.preventDefault();
          input.focus();
          return;
        }
        if (document.activeElement !== input) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setFocus(focusIdx + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setFocus(focusIdx - 1); }
        else if (e.key === 'Enter' && focusIdx >= 0) { e.preventDefault(); list.querySelector(`a[data-idx="${focusIdx}"]`)?.click(); }
        else if (e.key === 'Escape') { input.value = ''; render(); input.blur(); }
      });
      let debounce;
      const rerender = () => { clearTimeout(debounce); debounce = setTimeout(render, 160); };
      input.addEventListener('input', rerender);
      render();
    })();
  </script></main><footer class="site-footer"><div class="container"><div class="foot-grid"><div><div class="foot-brand">homo<span class="accent"> · </span>读书研思</div><p class="foot-note">以文字记录，以行走丈量。</p></div><nav class="foot-links" aria-label="页脚导航"><a href="/about">关于</a><a href="/blog">博客</a><a href="/reading">读书录</a><a href="/features">功能</a><a href="mailto:1191615708@qq.com">邮箱</a><a href="/rss.xml">RSS</a><a href="https://github.com/homozzy" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></div><div class="foot-meta"><span>© 2026 homo · 保留所有文章权利（除注明转载/摘录）</span><span>Astro 7 · GitHub Pages · 不追踪访客</span></div></div></footer><script>
