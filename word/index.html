</script></nav></div></header><main><div class="container-narrow" style="padding-top: 3rem;"><p class="eyebrow">One Word a Day</p><h1 class="page-title">日进一词<span class="accent">.</span></h1><p class="muted">每天一枚成语。同一天看到的是同一枚；明天，下一枚。</p><div class="word-display" style="margin-top: 1.4rem;"><div class="word" id="w-word"></div><div class="pinyin" id="w-pinyin"></div><p class="meaning" id="w-meaning"></p><p class="source" id="w-source"></p><p class="source" id="w-index" style="margin-top:0.3rem;"></p></div><div class="word-nav"><button class="btn btn-ghost btn-sm" id="w-prev" type="button">← 上一枚</button><button class="btn btn-ghost btn-sm" id="w-today" type="button">回到今天</button><button class="btn btn-ghost btn-sm" id="w-next" type="button">下一枚 →</button></div></div><script type="application/json" id="word-data">[{"word":"见微知著","pinyin":"jiàn wēi zhī zhù","meaning":"看到微小的苗头，就知道它的发展趋向。","source":"《韩非子·说林上》"},{"word":"闻鸡起舞","pinyin":"wén jī qǐ wǔ","meaning":"听到鸡叫就起来舞剑——比喻有志者抓紧时间刻苦自励。","source":"《晋书·祖逖传》"},{"word":"饮冰茹檗","pinyin":"yǐn bīng rú bò","meaning":"喝冷水吃黄檗，形容生活清苦，或心怀忧愤。","source":"《庄子·让王》"},{"word":"枕戈待旦","pinyin":"zhěn gē dài dàn","meaning":"枕着兵器等待天亮——形容时刻准备战斗。","source":"《晋书·刘琨传》"},{"word":"曲突徙薪","pinyin":"qū tū xǐ xīn","meaning":"把烟囱改弯、把柴火挪开——比喻防患于未然。","source":"《汉书·霍光传》"},{"word":"筚路蓝缕","pinyin":"bì lù lán lǚ","meaning":"驾着柴车、穿着破衣去开辟山林——形容创业艰苦。","source":"《左传·宣公十二年》"},{"word":"厚积薄发","pinyin":"hòu jī bó fā","meaning":"积累深厚，慢慢释放——比喻平时积累，关键时刻方能从容释放。","source":"《读书》（苏轼意）"},{"word":"登高望远","pinyin":"dēng gāo wàng yuăn","meaning":"登上高处看得远——比喻站得高、看得远。","source":"《荀子·劝学》"},{"word":"博学而笃志","pinyin":"bó xué ér dǔ zhì","meaning":"广博学习，坚守志向，诚实求问，深思明辨。","source":"《论语·子张》"},{"word":"学而时习之","pinyin":"xué ér shí xí zhī","meaning":"学习了并按时温习，不也很愉快吗。","source":"《论语·学而》"},{"word":"温故知新","pinyin":"wēn gù zhī xīn","meaning":"温习旧知识，获得新理解——可以做老师了。","source":"《论语·为政》"},{"word":"知行合一","pinyin":"zhī xíng hé yī","meaning":"知是行的开端，行是知的完成。","source":"王阳明 《传习录》"},{"word":"静观其变","pinyin":"jìng guān qí biàn","meaning":"静静观察事态的变化，不急于表态。","source":"成语"},{"word":"水到渠成","pinyin":"shuǐ dào qú chéng","meaning":"水流到了，沟渠自然形成——条件成熟了，事情自然成功。","source":"《景德传灯录》"},{"word":"积土成山","pinyin":"jī tǔ chéng shān","meaning":"堆积泥土成了高山——比喻积少成多，积小成大。","source":"《荀子·劝学》"},{"word":"月满则亏","pinyin":"yuè mǎn zé kuī","meaning":"月亮圆满时就开始亏缺——比喻盛极必衰。","source":"《国语·越语》"},{"word":"居安思危","pinyin":"jū ān sī wēi","meaning":"处在安全的环境，想到可能出现的危险。","source":"《左传·襄公十一年》"},{"word":"苟日新","pinyin":"gǒu rì xīn","meaning":"如果能天天除旧更新，那真是日日更新了。","source":"《礼记·大学》"},{"word":"不患寡而患不均","pinyin":"bù huàn guǎ ér huàn bù jūn","meaning":"不担心少，而担心不均匀。","source":"《论语·季氏》"},{"word":"己所不欲","pinyin":"jǐ suǒ bù yù","meaning":"自己不想要的，不要强加给别人。","source":"《论语·卫灵公》"},{"word":"君子和而不同","pinyin":"jūn zǐ hé ér bù tóng","meaning":"君子和谐相处而意见不必相同，小人同流合污而没有真正的和谐。","source":"《论语·子路》"},{"word":"学然后知不足","pinyin":"xué rán hòu zhī bù zú","meaning":"学习之后才知道自己的不足。","source":"《礼记·学记》"},{"word":"纸上得来终觉浅","pinyin":"zhǐ shàng dé lái zhōng jué qiǎn","meaning":"从书本上得到的终究浅薄——要真正理解须亲身实践。","source":"陆游《冬夜读书示子聿》"},{"word":"耳濡目染","pinyin":"ěr rú mù rǎn","meaning":"耳朵经常听到、眼睛经常看到，无形中受到影响。","source":"韩愈《清河郡公房公墓碣铭》"},{"word":"独学而无友","pinyin":"dú xué ér wú yǒu","meaning":"独自学习而没有朋友切磋，就会见识短浅。","source":"《礼记·学记》"},{"word":"不积跬步","pinyin":"bù jī kuǐ bù","meaning":"不积累半步一步，无法走到千里。","source":"《荀子·劝学》"},{"word":"尽信书不如无书","pinyin":"jìn xìn shū bù rú wú shū","meaning":"完全相信书不如没有书——读书要独立思考。","source":"《孟子·尽心下》"},{"word":"满招损","pinyin":"mǎn zhāo sǔn","meaning":"自满会招来损失，谦虚会带来益处。","source":"《尚书·大禹谟》"},{"word":"穷则独善其身","pinyin":"qióng zé dú shàn qí shēn","meaning":"困窘时独自修养好自身，显达时惠及天下。","source":"《孟子·尽心上》"},{"word":"是非之心","pinyin":"shì fēi zhī xīn","meaning":"能辨别是非的心——也叫作智之端。","source":"《孟子·公孙丑上》"}]</script><script>
    (() => {
      const WORDS = JSON.parse(document.getElementById('word-data').textContent);
      const dayIndex = () => Math.floor(Date.now() / 86400000);
      let offset = 0;
      const el = {
        word: document.getElementById('w-word'),
        pinyin: document.getElementById('w-pinyin'),
        meaning: document.getElementById('w-meaning'),
        source: document.getElementById('w-source'),
        index: document.getElementById('w-index'),
      };
      const render = () => {
        const i = ((dayIndex() + offset) % WORDS.length + WORDS.length) % WORDS.length;
        const w = WORDS[i];
        el.word.textContent = w.word;
        el.pinyin.textContent = w.pinyin;
        el.meaning.textContent = w.meaning;
        el.source.textContent = w.source;
        el.index.textContent = `第 ${i + 1} / ${WORDS.length} 枚 · ${offset === 0 ? '今天' : offset > 0 ? `后 ${offset} 天` : `前 ${-offset} 天`}`;
      };
      document.getElementById('w-prev')?.addEventListener('click', () => { offset--; render(); });
      document.getElementById('w-next')?.addEventListener('click', () => { offset++; render(); });
      document.getElementById('w-today')?.addEventListener('click', () => { offset = 0; render(); });
      render();
    })();
  </script></main><footer class="site-footer"><div class="container"><span>© 2026 homo · 以文字记录，以行走丈量。</span><span><a href="mailto:1191615708@qq.com">1191615708@qq.com</a><span aria-hidden="true"> · </span><a href="/rss.xml">RSS</a></span></div></footer></body></html>
