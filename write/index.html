(() => {
  const root = document.getElementById('cp-root');
  if (!root) return;
  const input = root.querySelector('#cp-input');
  const list = root.querySelector('#cp-list');
  const count = root.querySelector('#cp-count');
  let index = null;
  let loading = false;
  let focusIdx = -1;
  let results = [];
  const highlight = (text, q) => {
    const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    if (!q) return esc(text);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return esc(text).replace(re, m => `<mark>${m}</mark>`);
  };
  const setFocus = (i) => {
    const items = [...list.querySelectorAll('a')];
    if (!items.length) return;
    focusIdx = (i + items.length) % items.length;
    items.forEach((el, j) => el.classList.toggle('active', j === focusIdx));
    items[focusIdx].scrollIntoView({ block: 'nearest' });
  };
  const open = () => {
    root.classList.add('on');
    document.body.style.overflow = 'hidden';
    if (!index && !loading) {
      loading = true;
      fetch('/search-index.json').then(r => r.json()).then(d => { index = d; loading = false; }).catch(() => { loading = false; });
    }
    setTimeout(() => input.focus(), 10);
  };
  const close = () => {
    root.classList.remove('on');
    document.body.style.overflow = '';
    focusIdx = -1;
    results = [];
    input.value = '';
    list.innerHTML = '';
    count.textContent = '0';
  };
  const render = () => {
    const q = input.value.trim();
    focusIdx = -1;
    if (!q) { results = []; list.innerHTML = ''; count.textContent = '0'; return; }
    if (!index) { list.innerHTML = '<li class="cp-item"><a href="#">载入索引中…</a></li>'; return; }
    const lower = q.toLowerCase();
    results = index.filter(e => (e.title + ' ' + e.excerpt + ' ' + e.tag).toLowerCase().includes(lower)).slice(0, 12);
    count.textContent = String(results.length);
    list.innerHTML = results.map((e, i) => `<li class="cp-item"><a href="${e.url}" data-idx="${i}"><strong>${highlight(e.title, q)}</strong><em>${e.tag} · ${highlight(e.excerpt, q)}</em></a></li>`).join('')
      || '<li class="cp-item"><a href="#">没有匹配结果</a></li>';
  };
  document.addEventListener('keydown', (e) => {
    const meta = e.metaKey || e.ctrlKey;
    if (meta && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); root.classList.contains('on') ? close() : open(); return; }
    if (e.key === 'Escape') { close(); return; }
    if (!root.classList.contains('on')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocus(focusIdx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocus(focusIdx - 1); }
    else if (e.key === 'Enter' && focusIdx >= 0) { e.preventDefault(); list.querySelector(`a[data-idx="${focusIdx}"]`)?.click(); }
  });
  input.addEventListener('input', render);
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
})();
